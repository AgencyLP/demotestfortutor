<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Map Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Lesson Map Demo</h1>
      <p class="subtitle">Upload a PDF and generate segments + concepts JSON.</p>

      <form id="uploadForm" class="upload-form">
        <label for="pdfFile" class="file-label">Choose PDF</label>
        <input id="pdfFile" name="pdfFile" type="file" accept="application/pdf" />
        <button id="runBtn" type="submit">Generate Lesson Map</button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section id="teachPlanCard" class="card hidden">
      <h2>Teach Plan</h2>
      <p class="subtitle">Choose one chunk and generate a small teaching plan.</p>

      <div class="teach-controls">
        <label for="chunkSelect" class="file-label">Chunk</label>
        <select id="chunkSelect"></select>
        <button id="teachPlanBtn" type="button">Generate Teach Plan</button>
      </div>

      <pre id="teachPlanOutput" class="json-output small-output">{
  "message": "Generate a lesson map first, then choose one chunk."
}</pre>

      <div id="teachingDemo" class="teaching-demo hidden">
        <div class="output-header">
          <h2>Teaching Demo</h2>
          <button id="startTeachingBtn" type="button" class="secondary-btn">Start Lesson</button>
        </div>

        <div id="conversation" class="conversation" aria-live="polite"></div>

        <div class="answer-row">
          <textarea id="learnerAnswer" rows="3" placeholder="Type a learner answer..."></textarea>
          <button id="sendAnswerBtn" type="button">Send Answer</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="output-header">
        <h2>JSON Output</h2>
        <button id="copyBtn" type="button" class="secondary-btn">Copy JSON</button>
      </div>

      <pre id="jsonOutput" class="json-output">{
  "message": "Upload a PDF and click Generate Lesson Map."
}</pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
